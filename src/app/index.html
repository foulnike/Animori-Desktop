<!doctype html>
<!-- Тема стоит в разметке дефолтом: настройки читаются асинхронно, и без неё первый кадр был бы
     белым. startAppearance() из main.ts перепишет атрибут, когда выбор человека прочитан. -->
<html lang="ru" data-am-skin="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniMori</title>
    <style>
      /* Старт. Пока читаются настройки, поднимается тема и разбирается связка,
         окно пусто, а пустое окно читается как поломка — человек не знает,
         запустилось ли что-нибудь вообще. Здесь стоит знак программы.

         Знак лежит в разметке, а не во Vue, и это главное в его устройстве:
         он должен появиться до первого кадра приложения, а не после него.

         Снимает его main.ts, сразу после монтирования — и не из аккуратности,
         а потому что иначе он останется навсегда: Vue не стирает содержимое
         корня, он дописывает в него своё. Из-за этого заставка и стоит рядом
         с #app, а не внутри него: внутри её не отличить от разметки
         приложения, а снаружи у неё есть своё имя и свой срок.

         Стиль встроен, а не вынесен в theme.css: тот попадает в окно вместе
         со связкой, то есть позже этой разметки, и на первый кадр не успевает.
         Отсюда же и подстраховки: --am-bg читается с запасом на случай, что
         основного оформления ещё нет (в разработке стили вносит сам Vite,
         уже после первого кадра), а --am-ease-soft — с запасной кривой.

         Подложка своя и тёмная: атрибут темы в этой разметке всегда тёмный,
         и заставка под него не подстраивается. Для светлой темы окно и без
         заставки перекрашивается в тот же миг — startAppearance() меняет
         атрибут сразу после настроек, — так что лишней вспышки она не даёт.

         Дышения, а не вращения и не бега: знак просто сообщает, что процесс
         идёт. Системная просьба о покое гасит его, как и везде в приложении. */
      .am-start {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--am-bg, #070a10);
      }

      .am-start__mark {
        width: 72px;
        height: 72px;
        object-fit: contain;
        animation: am-start-breathe 1.9s var(--am-ease-soft, cubic-bezier(0.4, 0, 0.2, 1)) infinite;
      }

      @keyframes am-start-breathe {
        from {
          opacity: 0.5;
          transform: scale(0.93);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0.5;
          transform: scale(0.93);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .am-start__mark {
          animation: none;
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <!-- Корень из src/app/main.ts. Имя id менять нельзя в одном месте. -->
    <div id="app"></div>

    <!-- Заставка: см. стиль выше. Стоит последней в body, а не внутри #app: Vue не стирает
         содержимое корня, и внутри она осталась бы под окном до конца сеанса. -->
    <div id="boot" class="am-start">
      <img class="am-start__mark" src="../../src-tauri/icons/128x128.png" alt="" />
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
