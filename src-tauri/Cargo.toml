[package]
name = "animori"
version = "3.0.1"
description = "AniMori — Toolkit for AniList, desktop shell"
authors = ["foulnike"]
license = "MIT"
repository = "https://github.com/foulnike/Animori-Desktop"
edition = "2021"
rust-version = "1.77.2"

# Только rlib: staticlib/cdylib нужны мобильным целям Tauri — их в проекте нет, а в debug
# они давали лишние ~1,2 ГБ в target/ (animori_lib.lib + animori_lib.pdb).
[lib]
name = "animori_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Сохранение трека темы (export.rs): тело файла приходит из разметки строкой base64.
# Версия не на глаз: эту же мажорную уже тянет сам tauri (см. Cargo.lock).
base64 = "0.22"

# unsafe-headers — про Kodik: плагин по умолчанию выбрасывает Referer как запрещённый заголовок,
# а страница серии без него отдаёт заглушку, и /ftor чужую подпись не принимает.
tauri-plugin-http = { version = "2", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
  "socks",
  "unsafe-headers",
] }

tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2.5.4"
# Пункт 4.5: запоминает размер, положение и состояние окна между запусками.
# Требует Rust >= 1.77.2 — ровно ту версию, что указана в rust-version выше.
tauri-plugin-window-state = "2"

# Пункт П.2: автообновление; dialog — для двух родных окошек (согласие и ошибка), вызов идёт из Rust.
# Оба плагина дёргаются ТОЛЬКО из Rust: разрешений в capabilities им сознательно не выдано.
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Доступ к движку окна из Rust: потребитель один — proxy_auth.rs, событие авторизации живёт в COM WebView2.
# Версии не на глаз: их уже тянет wry (см. Cargo.lock); cfg(windows) обязателен — крейтов нет под другими ОС.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_WinRT",
] }
