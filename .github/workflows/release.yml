# Сборка и выкладка релиза приложения.
#
# Запуск только по тегу. По пушу в ветку сборка не идёт: каждый
# прогон — это полная компиляция Rust на windows-latest, а смысл она имеет
# только для выпуска.
#
# ИМЕНА ТЕГОВ. У проекта три продукта в трёх репозиториях, поэтому тег
# несёт приставку продукта:
#   app-3.0.0      — выпуск приложения, ведёт сюда;
#   script-2.2.0   — выпуск скрипта, живёт в foulnike/Animori-Script
#                    и СЮДА НЕ ВЕДЁТ;
#   выпуск приставки — APK в foulnike/Animori-TV, тоже не сюда.
#
# Прежние теги вида v2.0.2 из условия запуска убраны. По ним выходила старая
# гибридная оболочка, которой больше нет ни в одной рабочей ветке: собирать
# исправляющий выпуск 2.x больше нечем и не из чего. Сами теги и релизы 2.x
# остаются на месте нетронутыми.
#
# Что произойдёт с установленными копиями 2.x после первого выпуска 3.0.0:
# они получат его как обычное обновление — тот же identifier, тот же ключ подписи,
# тот же адрес манифеста, а номер 3.0.0 больше 2.0.2. Это и есть путь
# перехода: старая оболочка сама сменится новым приложением.
#
# Что уезжает в релиз:
#   1. AniMori_<версия>_x64-setup.exe — установщик, на который смотрит апдейтер;
#   2. его же .sig — подпись, без неё обновление не будет принято;
#   3. latest.json — манифест обновлений;
#   4. AniMori_Setup.exe — копия установщика под коротким именем для людей и README;
#   5. AniMori_<версия>_x64-portable.zip — приложение без установки;
#   6. AniMori_<версия>_x64_en-US.msi и его .sig — тот же выпуск вторым
#      установщиком, для тех, кому нужен именно msi. Обновление им не идёт:
#      манифест держится на NSIS (см. updaterJsonPreferNsis ниже).
#
# Юзерскрипта в этом списке больше нет. Прежде прогон собирал его первым
# шагом, откладывал копию в artifacts/ и выкладывал рядом с установщиком;
# теперь его выпускает свой конвейер в репозитории Animori-Script.
#
# Почему копия, а не переименование. latest.json ссылается на файл по имени,
# которое ему дал Tauri. Переименуешь артефакт — манифест покажет на несуществующий
# адрес, и обновление упадёт у всех сразу. Подпись считается от содержимого,
# поэтому копия под другим именем ничему не мешает.
#
# ВАЖНО ПРО ОТМЕНУ. Удаление тега уже запущенный прогон не останавливает: он
# работает со своей копией кода и на финальном шаге создаёт тег заново вместе
# с релизом. Чтобы отменить выпуск, сначала жми Cancel во вкладке Actions,
# и только потом удаляй тег.

name: release

on:
  push:
    tags:
      - 'app-*'

# Без этого токен прогона только читает, и создание релиза упадёт на 403.
permissions:
  contents: write

jobs:
  release:
    # Только Windows: целей сборки две — nsis и msi.
    runs-on: windows-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Номер версии из имени тега и сверка с package.json.
      #
      # Номер берётся образцом, а не отрезанием приставки: тег app-3.0 или
      # app-3.0.0-rc1 тихо дал бы странное имя портабл-архива вместо отказа.
      #
      # Сверка идёт с package.json — тем самым файлом, откуда номер берёт Tauri
      # (tauri.conf.json, "version": "../package.json") и по которому обновляются
      # установленные копии. Прежде здесь сверялся versions.json — отдельный файл
      # с номерами двух продуктов; продукт здесь один, и файл ушёл.
      #
      # Тег app-3.0.1 при номере 3.0.0 в файлах дал бы релиз, который никого
      # не обновляет. Лучше упасть здесь за полминуты, чем выкатить мёртвый выпуск.
      - name: Номер версии из тега
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^app-(?<v>\d+\.\d+\.\d+)$') {
            throw "Имя тега '$tag' не подходит под app-<версия>"
          }
          $version = $Matches['v']
          $declared = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          if ($version -ne $declared) {
            throw "Номер в теге ($version) расходится с package.json ($declared)"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "version=$version"
          Write-Host "Выпуск приложения: $version (тег $tag)"

      # Текст верхнего раздела CHANGELOG уходит и в описание релиза, и в окно
      # обновления внутри приложения: апдейтер показывает пользователю ровно
      # то, что лежит в поле notes манифеста, а туда попадает описание релиза.
      # Поэтому отсылка вида "См. CHANGELOG.md" здесь бесполезна — человек
      # видит её в диалоге вместо перечня изменений.
      #
      # Разбор простой: находим строки вида "## [" и берём всё между первой
      # и второй. Заголовок раздела не нужен — номер версии и так в имени релиза.
      - name: Описание релиза из CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $marks = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match '^## \[' }
          if ($marks.Count -eq 0) {
            throw 'В CHANGELOG.md не найдено ни одного раздела вида "## [версия]"'
          }
          $from = $marks[0] + 1
          $to = if ($marks.Count -gt 1) { $marks[1] - 1 } else { $lines.Count - 1 }
          $body = ($lines[$from..$to] -join "`n").Trim()
          # Потолок на случай очень большого раздела: тело релиза уходит в манифест
          # обновлений, раздувать его нечем.
          if ($body.Length -gt 3000) {
            $body = $body.Substring(0, 3000).TrimEnd() + "`n`n…полный список изменений — в CHANGELOG.md"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value 'body<<ANIMORI_NOTES'
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value 'ANIMORI_NOTES'
          Write-Host "Взято строк описания: $($to - $from + 1)"

      - name: Окружение Rust
        uses: dtolnay/rust-toolchain@stable

      # Компиляция зависимостей Tauri с нуля — это минуты. Кэш привязан к Cargo.lock,
      # который у нас закоммичен, поэтому попадание будет стабильным.
      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Нужны для beforeBuildCommand: сборку переднего края (npm run build:app)
      # запускает сам tauri-action перед компиляцией Rust.
      #
      # Прежде здесь шли ещё два шага — сборка юзерскрипта и откладывание его
      # копии, и порядок этих шагов был обязателен из-за emptyOutDir: !isTauri.
      # Сейчас в dist пишет один продукт, и порядок больше ничего не значит.
      - name: Зависимости npm
        run: npm ci

      # Собирает приложение, создаёт релиз по тегу, подписывает установщик
      # и сам генерирует latest.json. Писать манифест вручную не надо.
      #
      # Ключ подписи приходит только из секретов репозитория. В исходных файлах
      # его нет ни в каком виде и быть не может. Он тот же, что у выпусков 2.x:
      # смени его — и установленные копии откажутся принять обновление.
      #
      # Имя релиза — номер версии, а не имя тега: приставка продукта нужна
      # репозиторию, а не человеку в списке выпусков.
      - name: Сборка приложения и публикация релиза
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AniMori ${{ steps.ver.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Черновик и предварительный релиз оба выключены осознанно:
          # адрес releases/latest/download/... видит только опубликованный
          # непредварительный релиз, и апдейтер любой другой просто не заметит.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Обновление остаётся на NSIS. По умолчанию (false) манифест берёт
          # первый по приоритету установщик, а первый — как раз msi: все
          # установленные копии поставлены NSIS и пошли бы обновляться через
          # msiexec поверх себя, то есть второй записью в списке программ.
          # Оба установщика в релиз уезжают, но в latest.json попадает setup.exe.
          updaterJsonPreferNsis: true

      # Короткое имя для человека. Исходный файл остаётся на месте нетронутым —
      # именно на него ссылается latest.json.
      #
      # Папку artifacts создаёт этот шаг: прежде её создавал шаг с копией
      # юзерскрипта, которого больше нет.
      - name: Копия установщика под коротким именем
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $setup = Get-ChildItem -Path src-tauri/target -Recurse -Filter *-setup.exe |
            Where-Object { $_.DirectoryName -match 'bundle\\nsis$' } |
            Select-Object -First 1
          if (-not $setup) {
            throw 'Установщик NSIS не найден — сборка что-то положила не туда'
          }
          Copy-Item $setup.FullName artifacts/AniMori_Setup.exe
          Write-Host "Исходный артефакт: $($setup.FullName)"

      # Портабл-версия. Отдельной цели сборки под неё у Tauri нет: приложение —
      # это один самодостаточный exe, интерфейс вшит в бинарник на этапе
      # компиляции. Поэтому просто берём его из target и упаковываем.
      #
      # Поиск рекурсивный: без явной цели Cargo кладёт бинарник в target/release,
      # а если сборщик передаст --target — в target/<тройка>/release. Отбираем
      # только файл из самой папки release: в deps лежат промежуточные копии.
      #
      # В автообновлении архив не участвует: подпись и latest.json Tauri считает
      # только для установщика. Портабл обновляется заменой файла вручную.
      #
      # Настройки и токен всё равно лягут в профиль пользователя
      # (AppData\Roaming\com.foulnike.animori) — переносимым является сам запуск
      # без установки, а не хранилище.
      - name: Портабл-архив
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target -Recurse -Filter AniMori.exe |
            Where-Object { $_.DirectoryName -match 'release$' } |
            Select-Object -First 1
          if (-not $exe) {
            throw 'AniMori.exe не найден в src-tauri/target'
          }
          $version = '${{ steps.ver.outputs.version }}'
          $stage = "portable/AniMori_$version"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName (Join-Path $stage 'AniMori.exe')
          Copy-Item README.md (Join-Path $stage 'README.md')
          Copy-Item LICENSE (Join-Path $stage 'LICENSE')
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/AniMori_${version}_x64-portable.zip" -Force
          Write-Host "Портабл собран из: $($exe.FullName)"

      # Докладывает недостающие файлы в уже созданный релиз того же тега.
      - name: Доложить артефакты в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/AniMori_Setup.exe
            artifacts/AniMori_*_x64-portable.zip

  # Linux-пакеты: deb в тот же релиз. Updater-артефакты не собираем —
  # автообновление живёт на NSIS (см. updaterJsonPreferNsis выше), а без их
  # отключения сборка потребует ключ подписи.
  linux:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Исходный код
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Системные зависимости WebKitGTK 4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Окружение Rust
        uses: dtolnay/rust-toolchain@stable

      # Кэш привязан к Cargo.lock, который у нас закоммичен, поэтому попадание стабильно.
      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости npm
        run: npm ci

      # beforeBuildCommand (npm run build:app) tauri запустит сам.
      - name: Сборка Linux-пакетов
        run: npm run tauri:build -- --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Доложить Linux-артефакты в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
