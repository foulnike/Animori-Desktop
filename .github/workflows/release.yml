# Сборка и выкладка релиза приложения. Запуск только по тегу. По пушу в ветку сборка не идёт: каждый
# прогон — это полная компиляция Rust на windows-latest, а смысл она имеет только для выпуска.

name: release

on:
  push:
    tags:
      - 'app-*'

# Без этого токен прогона только читает, и создание релиза упадёт на 403.
permissions:
  contents: write

jobs:
  release:
    # Только Windows: целей сборки две — nsis и msi.
    runs-on: windows-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Номер версии из имени тега и сверка с package.json. Номер берётся образцом, а не отрезанием
      # приставки: тег app-3.0 или app-3.0.0-rc1 тихо дал бы странное имя портабл-архива вместо…
      - name: Номер версии из тега
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^app-(?<v>\d+\.\d+\.\d+)$') {
            throw "Имя тега '$tag' не подходит под app-<версия>"
          }
          $version = $Matches['v']
          $declared = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          if ($version -ne $declared) {
            throw "Номер в теге ($version) расходится с package.json ($declared)"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "version=$version"
          Write-Host "Выпуск приложения: $version (тег $tag)"

      # Текст верхнего раздела CHANGELOG уходит и в описание релиза, и в окно обновления внутри
      # приложения: апдейтер показывает пользователю ровно то, что лежит в поле notes манифеста.
      - name: Описание релиза из CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $marks = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match '^## \[' }
          if ($marks.Count -eq 0) {
            throw 'В CHANGELOG.md не найдено ни одного раздела вида "## [версия]"'
          }
          $from = $marks[0] + 1
          $to = if ($marks.Count -gt 1) { $marks[1] - 1 } else { $lines.Count - 1 }
          $body = ($lines[$from..$to] -join "`n").Trim()
          # Потолок на случай очень большого раздела: тело релиза уходит в манифест
          # обновлений, раздувать его нечем.
          if ($body.Length -gt 3000) {
            $body = $body.Substring(0, 3000).TrimEnd() + "`n`n…полный список изменений — в CHANGELOG.md"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value 'body<<ANIMORI_NOTES'
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value 'ANIMORI_NOTES'
          Write-Host "Взято строк описания: $($to - $from + 1)"

      - name: Окружение Rust
        uses: dtolnay/rust-toolchain@stable

      # Компиляция зависимостей Tauri с нуля — это минуты. Кэш привязан к Cargo.lock,
      # который у нас закоммичен, поэтому попадание будет стабильным.
      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Нужны для beforeBuildCommand: сборку переднего края (npm run build:app) запускает сам
      # tauri-action перед компиляцией Rust.
      - name: Зависимости npm
        run: npm ci

      # Собирает приложение, создаёт релиз по тегу, подписывает установщик и сам генерирует
      # latest.json. Писать манифест вручную не надо.
      - name: Сборка приложения и публикация релиза
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AniMori ${{ steps.ver.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Черновик и предварительный релиз оба выключены осознанно: адрес
          # releases/latest/download/...
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # По умолчанию (false) манифест берёт первый по приоритету установщик, а первый — как раз
          # msi: все установленные копии поставлены NSIS и пошли бы обновляться через msiexec…
          updaterJsonPreferNsis: true

      # Короткое имя для человека. Исходный файл остаётся на месте нетронутым — именно на него
      # ссылается latest.json.
      - name: Копия установщика под коротким именем
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $setup = Get-ChildItem -Path src-tauri/target -Recurse -Filter *-setup.exe |
            Where-Object { $_.DirectoryName -match 'bundle\\nsis$' } |
            Select-Object -First 1
          if (-not $setup) {
            throw 'Установщик NSIS не найден — сборка что-то положила не туда'
          }
          Copy-Item $setup.FullName artifacts/AniMori_Setup.exe
          Write-Host "Исходный артефакт: $($setup.FullName)"

      # Портабл-версия. Отдельной цели сборки под неё у Tauri нет: приложение — это один
      # самодостаточный exe, интерфейс вшит в бинарник на этапе компиляции.
      - name: Портабл-архив
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target -Recurse -Filter AniMori.exe |
            Where-Object { $_.DirectoryName -match 'release$' } |
            Select-Object -First 1
          if (-not $exe) {
            throw 'AniMori.exe не найден в src-tauri/target'
          }
          $version = '${{ steps.ver.outputs.version }}'
          $stage = "portable/AniMori_$version"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName (Join-Path $stage 'AniMori.exe')
          Copy-Item README.md (Join-Path $stage 'README.md')
          Copy-Item LICENSE (Join-Path $stage 'LICENSE')
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/AniMori_${version}_x64-portable.zip" -Force
          Write-Host "Портабл собран из: $($exe.FullName)"

      # Докладывает недостающие файлы в уже созданный релиз того же тега.
      - name: Доложить артефакты в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/AniMori_Setup.exe
            artifacts/AniMori_*_x64-portable.zip
